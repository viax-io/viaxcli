name: ci

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt

      - name: Cache cargo registry and target dirs
        uses: Swatinem/rust-cache@v2

      - name: Build (root crate)
        run: cargo build --verbose

      - name: Test viax-config
        run: cargo test --manifest-path config/Cargo.toml --verbose

      - name: Test api
        run: cargo test --manifest-path api/Cargo.toml --verbose

      - name: Test viax (root CLI)
        run: cargo test --manifest-path Cargo.toml --verbose
